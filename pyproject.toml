[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wasapi-latency"
dynamic = ["version"]
description = "Inspect Windows WASAPI devices and buffer latency from the CLI."
readme = "README.md"
license = "MIT"
authors = [
    { name = "negg0s" }
]
keywords = ["windows", "audio", "wasapi", "latency", "sounddevice", "buffer-tuning", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "sounddevice>=0.4",
]

[project.urls]
Homepage = "https://github.com/negg0s/wasapi-latency"
Repository = "https://github.com/negg0s/wasapi-latency.git"
Issues = "https://github.com/negg0s/wasapi-latency/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wasapi-latency = "wasapi_latency.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wasapi_latency.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["wasapi_latency*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
