[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wasapi-latency"
dynamic = ["version"]
description = "Inspect Windows WASAPI devices and buffer latency from the CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wasapi-latency = "wasapi_latency.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wasapi_latency.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["wasapi_latency*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
