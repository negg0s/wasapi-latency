[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wasapi-latency"
version = "0.1.0"
description = "Inspect and tune Windows WASAPI buffer latency from the CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "sounddevice>=0.4",
]

[project.scripts]
wasapi-latency = "wasapi_latency.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wasapi_latency*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
