name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]" --no-cache-dir
      - name: Check text
        run: python tools/check_text.py
      - name: Test
        run: python -m pytest
      - name: CLI smoke test
        run: |
          wasapi-latency --help
          wasapi-latency profiles
          python -m wasapi_latency list --help
          python -m wasapi_latency info --help
          python -m wasapi_latency measure --help
          python -m wasapi_latency recommend --help
          python -m wasapi_latency doctor --help
